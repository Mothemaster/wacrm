name: Build Oracle image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact source version from Oracle
        uses: actions/checkout@v4
        with:
          repository: ArnasDon/wacrm
          ref: c81299d1488aac02fa584f68d97c2524c1e7a661
          persist-credentials: false

      - name: Validate required public build settings
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          APP_LOCALE: ${{ secrets.NEXT_PUBLIC_APP_LOCALE }}
        run: |
          set -eu
          for name in SUPABASE_URL SUPABASE_ANON_KEY SITE_URL APP_LOCALE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing build setting: $name"
              exit 1
            fi
          done

      - name: Increase Node heap for the build stage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Dockerfile")
          text = path.read_text()
          original = "RUN npm run build"
          if text.count(original) != 1:
              raise SystemExit("Expected exactly one Docker build command")
          path.write_text(text.replace(
              original,
              'RUN NODE_OPTIONS="--max-old-space-size=4096" npm run build'
          ))
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mothemaster/wacrm:oracle-${{ github.run_id }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_APP_LOCALE=${{ secrets.NEXT_PUBLIC_APP_LOCALE }}
